<!doctype html>
<html lang="en" data-theme="darkroom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Set the theme before first paint: stored choice, else the OS preference. -->
    <script>
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'darkroom' && t !== 'paper') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'darkroom'
        }
        var d = document.documentElement
        d.setAttribute('data-theme', t)
        d.style.colorScheme = t === 'paper' ? 'light' : 'dark'
        d.classList.add('js')
      })()
    </script>
    <!-- Favicon: an ArUco-style marker whose 16 inner bits spell "SW" in ASCII. -->
    <link

    />
